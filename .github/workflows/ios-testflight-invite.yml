name: Invite TestFlight Tester

on:
  workflow_dispatch:
    inputs:
      email:
        description: Tester email address
        required: true
        type: string
      first_name:
        description: Tester first name
        required: false
        default: Tester
        type: string
      last_name:
        description: Tester last name
        required: false
        default: User
        type: string
      group:
        description: External TestFlight group name
        required: false
        default: External Testers
        type: string

jobs:
  invite:
    name: Invite tester
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      TESTFLIGHT_TESTER_EMAIL: ${{ inputs.email }}
      TESTFLIGHT_TESTER_FIRST_NAME: ${{ inputs.first_name }}
      TESTFLIGHT_TESTER_LAST_NAME: ${{ inputs.last_name }}
      TESTFLIGHT_GROUP: ${{ inputs.group }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Invite tester
        run: bundle exec fastlane ios invite_tester
