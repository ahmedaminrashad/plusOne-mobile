name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta

      - name: Upload distribution certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-distribution-p12
          path: ci_distribution.p12
          if-no-files-found: ignore
          retention-days: 7
